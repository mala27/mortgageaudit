<!DOCTYPE html>
<html>
<head>
    <title>Loan Audit Engine</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .input-group { margin-bottom: 10px; display: flex; align-items: center; }
        label { width: 120px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .yellow-input { background-color: #ffffcc; border: 1px solid #ccc; padding: 5px; width: 80px; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Loan Audit Input</h2>
    <div id="inputs">
        <div class="input-group">
            <label>Interest 1: </label>
            <input type="number" id="int1" class="yellow-input" step="0.001" value="2.5">%
        </div>
        <div class="input-group">
            <label>Interest 2: </label>
            <input type="number" id="int2" class="yellow-input" step="0.001" value="0">%
        </div>
        <div class="input-group">
            <label>Interest 3: </label>
            <input type="number" id="int3" class="yellow-input" step="0.001" value="0">%
        </div>
        <div class="input-group">
            <label>Interest 4: </label>
            <input type="number" id="int4" class="yellow-input" step="0.001" value="0">%
        </div>
        <div class="input-group">
            <label>Interest 5: </label>
            <input type="number" id="int5" class="yellow-input" step="0.001" value="0">%
        </div>
        <div class="input-group">
            <label>Interest 6: </label>
            <input type="number" id="int6" class="yellow-input" step="0.001" value="0">%
        </div>
    </div>

    <button onclick="runAudit()">Calculate Audit</button>

    <table>
        <thead>
            <tr>
                <th>Pmt. No.</th>
                <th>Payment Date</th>
                <th>Beginning Balance</th>
                <th>Interest</th>
                <th>Ending Balance</th>
            </tr>
        </thead>
        <tbody id="auditTable">
            <tr><td colspan="5">Upload your Excel and click Calculate to see results.</td></tr>
        </tbody>
    </table>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        async function runAudit() {
            try {
                const response = await fetch('Loan-Amortization.xlsx');
                if (!response.ok) throw new Error("Excel file not found in repository.");
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array', cellFormula: true });
                const sheetName = workbook.SheetNames;
                const worksheet = workbook.Sheets[sheetName];

                // Map inputs to cells F5 through F10
                const rates = [
                    [document.getElementById('int1').value / 100],
                    [document.getElementById('int2').value / 100],
                    [document.getElementById('int3').value / 100],
                    [document.getElementById('int4').value / 100],
                    [document.getElementById('int5').value / 100],
                    [document.getElementById('int6').value / 100]
                ];

                XLSX.utils.sheet_add_aoa(worksheet, rates, { origin: "F5" });

                // Extract data starting from the payment schedule (Row 19 approx)
                const data = XLSX.utils.sheet_to_json(worksheet, { header: 1, range: 18 });
                const tableBody = document.getElementById('auditTable');
                tableBody.innerHTML = '';

                data.forEach(row => {
                    if (row && !isNaN(row)) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row || ''}</td>
                            <td>${row || ''}</td>
                            <td>${row ? parseFloat(row).toFixed(2) : ''}</td>
                            <td>${row ? parseFloat(row).toFixed(2) : ''}</td>
                            <td>${row ? parseFloat(row).toFixed(2) : ''}</td>
                        `;
                        tableBody.appendChild(tr);
                    }
                });
            } catch (error) {
                alert("Error: " + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
