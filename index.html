<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Audit Calculator - April 7 Version</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .input-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px; }
        button { background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: center; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mortgage Audit Calculator</h2>
        <div class="input-row">
            <div class="input-group">
                <label>Loan Amount</label>
                <input type="number" id="loanAmount" placeholder="e.g. 250000">
            </div>
            <div class="input-group">
                <label>Annual Interest (%)</label>
                <input type="number" id="interestRate" step="0.01" placeholder="e.g. 4.5">
            </div>
            <div class="input-group">
                <label>Term (Years)</label>
                <input type="number" id="loanTerm" placeholder="e.g. 25">
            </div>
        </div>
        <div class="input-group">
                <label>Term (Months)</label>
                <input type="number" id="loanTermMonth" placeholder="e.g. 6">
            </div>
        <button onclick="runMortgageAudit()">Generate Audit Schedule</button>

        <table id="auditTable">
            <thead>
                <tr>
                    <th>Period</th>
                    <th>Payment</th>
                    <th>Principal</th>
                    <th>Interest</th>
                    <th>Remaining Balance</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function runMortgageAudit() {
            const principal = parseFloat(document.getElementById('loanAmount').value);
            const annualRate = parseFloat(document.getElementById('interestRate').value) / 100;
            const years = parseFloat(document.getElementById('loanTerm').value);
            const months = parseFloat(document.getElementById('loanTermMonth').value);

            const monthlyRate = annualRate / 12;
            const numberOfPayments = years * 12;
            const monthlyPayment = (principal * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -numberOfPayments));

            let balance = principal;
            const tbody = document.querySelector('#auditTable tbody');
            tbody.innerHTML = '';

            for (let i = 1; i <= numberOfPayments; i++) {
                const interestM = balance * monthlyRate;
                const principalM = monthlyPayment - interestM;
                balance -= principalM;

                const row = `<tr>
                    <td>${i}</td>
                    <td>£${monthlyPayment.toFixed(2)}</td>
                    <td>£${principalM.toFixed(2)}</td>
                    <td>£${interestM.toFixed(2)}</td>
                    <td>£${Math.max(0, balance).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            }
        }
    </script>
</body>
</html>
