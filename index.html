<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mortgage Audit Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .input-group { margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: right; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h2>Loan Amortization Audit</h2>
    <div class="input-group">
        <label>Principal: </label><input type="number" id="principal" value="100000">
    </div>
    <div class="input-group">
        <label>Interest Rate (%): </label><input type="number" id="rate" value="5" step="0.1">
    </div>
    <div class="input-group">
        <label>Term (Years): </label><input type="number" id="years" value="30">
    </div>
    <button onclick="calculate()">Calculate Amortization</button>

    <table id="schedule">
        <thead>
            <tr>
                <th>Month</th>
                <th>Payment</th>
                <th>Principal</th>
                <th>Interest</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('principal').value);
            const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
            const n = parseFloat(document.getElementById('years').value) * 12;
            const x = Math.pow(1 + r, n);
            const monthly = (p * x * r) / (x - 1);

            let balance = p;
            let tbody = document.querySelector('#schedule tbody');
            tbody.innerHTML = '';

            for (let i = 1; i <= n; i++) {
                let interest = balance * r;
                let principal = monthly - interest;
                balance -= principal;

                let row = `<tr>
                    <td>${i}</td>
                    <td>${monthly.toFixed(2)}</td>
                    <td>${principal.toFixed(2)}</td>
                    <td>${interest.toFixed(2)}</td>
                    <td>${Math.max(0, balance).toFixed(2)}</td>
                </tr>`;
                tbody.innerHTML += row;
            }
        }
    </script>
</body>
</html>
